[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cascadeur-mcp"
version = "0.5.0a9"
description = "C01: a minimal Cascadeur MCP animation bridge PoC"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["mcp>=1.28,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
cascadeur-mcp = "cascadeur_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
